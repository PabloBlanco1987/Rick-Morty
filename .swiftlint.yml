# Configuración de SwiftLint para RickAndMorty.
# Ajustada al estilo que ya tiene el proyecto: Swift 6, SwiftUI, un núcleo de tres
# capas (Domain / Data / Presentation) y suites de Swift Testing.

included:
  - RickAndMorty
  - RickAndMortyTests
  - RickAndMortyUITests

excluded:
  - .build
  - DerivedData
  - build

# Reglas opt-in que se han ganado estar aquí. El resto se dejan fuera a propósito, para
# que el linter señale problemas de verdad y no preferencias personales.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  # El estilo de la casa deja coma final en los literales multilínea: añadir una
  # entrada toca una sola línea y el diff queda limpio.
  - trailing_comma

# La regla `todo` da por hecho que un TODO es deuda olvidada, y aquí no lo es: los TODO
# de este proyecto son los límites asumidos del README §8, y cada uno lleva tres partes
# —qué falta, por qué se decidió no hacerlo y por dónde entraría— más la referencia a
# esa sección, para que se lean en las dos direcciones. Son documentación deliberada y
# localizable con `grep TODO`, no un «ya lo haré». Por eso la regla se acota en vez de
# apagarse: sigue avisando en FIXME, que es la marca de lo que está roto y sí hay que
# resolver, y ahí es donde tiene que doler.
todo:
  only: [FIXME]

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 80

# `id`, `to` y compañía son legítimos en modelos y en código de vistas.
identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - to
    - up

type_name:
  min_length: 3
  max_length:
    warning: 45
    error: 60

nesting:
  type_level: 2

cyclomatic_complexity:
  warning: 10
  error: 15

# `(sut, stub, spy)` es lo que devuelve de forma natural un helper de test.
large_tuple:
  warning: 3
  error: 4

reporter: "xcode"
