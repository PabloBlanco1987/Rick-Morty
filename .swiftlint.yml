# SwiftLint configuration for RickAndMorty.
# Tuned to the style already present in the project: Swift 6, SwiftUI, a
# three-layer core (Domain / Data / Presentation) and Swift Testing suites.

included:
  - RickAndMorty
  - RickAndMortyTests
  - RickAndMortyUITests

excluded:
  - .build
  - DerivedData
  - build

# Opt-in rules that earn their place here. The rest are left out on purpose so
# the linter flags real problems rather than personal preferences.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  # House style keeps a trailing comma in multi-line literals: adding an entry
  # touches one line and the diff stays clean.
  - trailing_comma

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 80

# `id`, `to` and friends are legitimate in models and view code.
identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - to
    - up

type_name:
  min_length: 3
  max_length:
    warning: 45
    error: 60

nesting:
  type_level: 2

cyclomatic_complexity:
  warning: 10
  error: 15

# `(sut, stub, spy)` is the natural return of a test helper.
large_tuple:
  warning: 3
  error: 4

reporter: "xcode"
